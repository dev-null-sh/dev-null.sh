# yaml-language-server: $schema=https://raw.githubusercontent.com/Chemaclass/agnostic-ai/v0.84.0/docs/schemas/config.schema.json
version: 1
requires: ">=0.84.0"

targets:
  - claude
  - codex
  - gemini
  - cursor
  - copilot
  - amp
  - opencode
  - junie

# Set to error to fail sync when a target cannot represent a spec.
on-unsupported: warn

gitignore:
  enabled: true
