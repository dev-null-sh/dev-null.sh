name: tia-baseline

# Records the Pest Test Impact Analysis (TIA) dependency graph once per merge to
# production and publishes it as the `pest-tia-baseline` artifact. Developers with
# `pest()->tia()->baselined()` enabled download it on their first local run instead
# of recording it themselves. See https://pestphp.com/docs/tia.

on:
  push:
    branches:
      - production
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # TIA records the commit the graph was built at and diffs against it locally.
          fetch-depth: 0

      - name: Enable PostgreSQL Search Extensions
        run: |
          # Parallel test databases inherit extensions from template1.
          for database in testing template1; do
            docker exec "${{ job.services.postgres.id }}" \
              psql -U root -d "$database" -v ON_ERROR_STOP=1 \
              -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          done

      - name: Setup
        uses: ./.github/actions/setup
        with:
          coverage: pcov

      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate --with-form

      - name: Cache Built Assets
        id: build-cache
        uses: actions/cache@v6
        with:
          path: public/build
          key: ${{ runner.os }}-build-${{ hashFiles('bun.lock', 'package.json', 'vite.config.ts', 'tsconfig.json', 'resources/**', 'routes/**', 'app/**') }}

      - name: Build Assets
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: bun run build

      - name: Record TIA Baseline
        run: php -d memory_limit=-1 vendor/bin/pest --parallel --tia --coverage --fresh --passthru-php="'-d' 'memory_limit=-1'"

      - name: Resolve TIA Baseline Path
        id: baseline
        run: echo "path=$(vendor/bin/pest --baseline)" >> "$GITHUB_OUTPUT"

      - name: Upload TIA Baseline
        uses: actions/upload-artifact@v7
        with:
          name: pest-tia-baseline
          path: ${{ steps.baseline.outputs.path }}
          retention-days: 30
