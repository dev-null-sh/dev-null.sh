name: Setup
description: Installs PHP, Bun, Node and the project's dependencies, restoring them from cache when possible.

inputs:
  coverage:
    description: The PHP coverage driver to install.
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: ./.github/actions/setup-php
      with:
        coverage: ${{ inputs.coverage }}

    - name: Setup Frontend
      uses: ./.github/actions/setup-frontend
